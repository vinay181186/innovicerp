<!-- @dsCard group="Components" viewport="700x640" name="Records" subtitle="ItemBadge, QtyStrip, Fact, KpiTiles, MachineCard, SortHeader" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg);padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.lbl{font:600 10px var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;width:78px;flex-shrink:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.InnovicERPDesignSystem_4a2115 || {};

const { ItemBadge, ItemImageBox, QtyStrip, Fact, KpiTiles, MachineCard, SortHeader, Panel } = NS;
function App(){const [k,setK]=React.useState('ip');const [s,setS]=React.useState({f:'code',d:'asc'});
const tiles=[['np','Needs Planning',6,'var(--red)'],['ip','In Planning',4,'var(--amber)'],['pl','Planned (Ready)',9,'var(--blue)'],['jc','JC Created',12,'var(--cyan)'],['pr','PR Created (Buy)',3,'#8b5cf6'],['ok','Complete',41,'var(--green)']].map(([key,label,value,color])=>({key,label,value,color,active:k===key}));
return <div>
<div className="row" style={{gap:18,alignItems:'flex-start'}}>
<div style={{width:220}}><ItemBadge code="BF-SH-2210" revision="B" name="Pinion Shaft — EN19 Ø45"/></div>
<ItemBadge size="card" code="KP-VH-0091" revision="C" name="Valve Housing"/>
<ItemBadge size="page" code="BF-GR-1180" revision="A" name="Spur Gear 42T" codeColor="var(--text)"/>
<ItemBadge size="tile" code="TX-FR-0001" name="Main Frame Weldment" codeColor="var(--text)"/>
</div>
<div className="row" style={{gap:18}}><QtyStrip items={[{label:'Total Qty',value:120},{label:'JC Qty',value:80,color:'var(--amber)'},{label:'Lines',value:3}]}/><Fact label="EQUIP QTY" value="2" big/><Fact label="DUE" value="2026-10-20"/><Fact label="BOM STATUS" value="⚠ BOM Pending" color="var(--amber)"/></div>
<KpiTiles items={tiles} onSelect={setK}/>
<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:12}}>
<MachineCard code="CNC-01" name="LMW LL20T" running jobCard="IN-JC-26-0917" itemCode="BF-SH-2210/B" operation="Op10: CNC Turning" selected/>
<MachineCard code="VMC-02" name="BFW Gaurav" running jobCard="IN-JC-26-0922" itemCode="BF-GR-1180/A" operation="Op20: Drilling"/>
<MachineCard code="CG-02" name="Cylindrical Grinder"/>
<MachineCard code="HOB-01" name="Hobbing M/c"/>
</div>
<table className="innovic-table tbl-grid" style={{maxWidth:420}}><thead><tr>{[['code','Item Code'],['name','Item Name'],['qty','Stock']].map(([f,l])=><th key={f}><SortHeader label={l} active={s.f===f} dir={s.d} onSort={()=>setS({f,d:s.f===f&&s.d==='asc'?'desc':'asc'})}/></th>)}</tr></thead>
<tbody><tr><td className="td-code">BF-SH-2210</td><td>Pinion Shaft</td><td className="mono fw-700">42</td></tr></tbody></table>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
