<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg2)}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{width:84px}.c{height:48px;border-radius:6px;border:1px solid var(--border)}.n{font:600 11px var(--mono);color:var(--text);margin-top:4px}.h{font:400 10px var(--mono);color:var(--text3)}</style></head><body><div class="sw"><div style="flex:1;min-width:110px;padding:10px;border-radius:6px;background:var(--sig-critical-bg);border:1px solid var(--sig-critical-bd)"><div style="width:10px;height:10px;border-radius:50%;background:var(--sig-critical);margin-bottom:6px"></div><div style="font:700 12px var(--bfont);color:var(--text)">critical</div><div class="h">--sig-critical</div></div><div style="flex:1;min-width:110px;padding:10px;border-radius:6px;background:var(--sig-warn-bg);border:1px solid var(--sig-warn-bd)"><div style="width:10px;height:10px;border-radius:50%;background:var(--sig-warn);margin-bottom:6px"></div><div style="font:700 12px var(--bfont);color:var(--text)">warn</div><div class="h">--sig-warn</div></div><div style="flex:1;min-width:110px;padding:10px;border-radius:6px;background:var(--sig-ok-bg);border:1px solid var(--sig-ok-bd)"><div style="width:10px;height:10px;border-radius:50%;background:var(--sig-ok);margin-bottom:6px"></div><div style="font:700 12px var(--bfont);color:var(--text)">ok</div><div class="h">--sig-ok</div></div><div style="flex:1;min-width:110px;padding:10px;border-radius:6px;background:var(--sig-info-bg);border:1px solid var(--sig-info-bd)"><div style="width:10px;height:10px;border-radius:50%;background:var(--sig-info);margin-bottom:6px"></div><div style="font:700 12px var(--bfont);color:var(--text)">info</div><div class="h">--sig-info</div></div><div style="flex:1;min-width:110px;padding:10px;border-radius:6px;background:var(--sig-neutral-bg);border:1px solid var(--sig-neutral-bd)"><div style="width:10px;height:10px;border-radius:50%;background:var(--sig-neutral);margin-bottom:6px"></div><div style="font:700 12px var(--bfont);color:var(--text)">neutral</div><div class="h">--sig-neutral</div></div></div></body></html>
