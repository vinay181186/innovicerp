<script>
/* ════════════════════════════════════════════════════════════════
   1. STORAGE — every collection is one array in localStorage
   ════════════════════════════════════════════════════════════════ */
const KEY = 'innovic_erp_sandbox_v1';
let DB = {};

function load(){ try{ DB = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ DB = {}; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function all(c){ return (DB[c] || []).filter(r => !r._del); }
function put(c, row){
  DB[c] = DB[c] || [];
  const i = DB[c].findIndex(r => r.id === row.id);
  if (i >= 0) DB[c][i] = row; else DB[c].push(row);
  save();
}
function del(c, id){
  // Soft delete — Rule 8: the real ERP never hard-deletes either.
  const r = (DB[c]||[]).find(x => x.id === id);
  if (r){ r._del = new Date().toISOString(); save(); }
}
function byId(c, id){ return (DB[c]||[]).find(r => r.id === id); }
function uid(){ return 'x' + Math.random().toString(36).slice(2, 10); }
function today(){ return new Date().toISOString().slice(0, 10); }

/** Next document number in a company series, e.g. IN-SO-00007. */
function nextNo(c, prefix){
  let max = 0;
  (DB[c]||[]).forEach(r => {
    const m = String(r.code||'').startsWith(prefix) && String(r.code).slice(prefix.length).match(/^(\d+)$/);
    if (m) max = Math.max(max, +m[1]);
  });
  return prefix + String(max + 1).padStart(5, '0');
}

/* ── Stock is DERIVED, never stored. Same as v_item_stock. ── */
function stockOf(itemId){
  return all('store_transactions')
    .filter(t => t.itemId === itemId)
    .reduce((s, t) => s + (t.txnType === 'in' ? +t.qty : -(+t.qty)), 0);
}
function ledger(itemId, type, qty, src, ref, note){
  if (!itemId || !qty) return;
  const before = stockOf(itemId);
  put('store_transactions', {
    id: uid(), txnDate: today(), itemId, txnType: type, qty: +qty,
    sourceType: src, sourceRef: ref, stockBefore: before,
    stockAfter: type === 'in' ? before + (+qty) : before - (+qty),
    remarks: note || '', _at: new Date().toISOString(),
  });
}
function logAct(action, entity, detail){
  put('activity_log', { id: uid(), _at: new Date().toISOString(),
    ts: new Date().toLocaleString(), action, entity, detail, user: 'admin' });
}

/* ════════════════════════════════════════════════════════════════
   3. HELPERS
   ════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => '₹' + (+n || 0).toLocaleString('en-IN', {maximumFractionDigits:2});

/** Human label for a row of any collection — code + name if both exist. */
function labelOf(coll, id){
  const r = byId(coll, id); if (!r) return '—';
  const a = r.code || r.bomNo || '', b = r.name || r.bomName || r.partName || r.title || r.material || '';
  return (a && b) ? `${a} — ${b}` : (a || b || id.slice(0,6));
}
function pill(v){
  const s = String(v||'').toLowerCase();
  const m = { open:'bg-sky-100 text-sky-800', draft:'bg-slate-100 text-slate-700',
    active:'bg-emerald-100 text-emerald-800', in_progress:'bg-amber-100 text-amber-800',
    closed:'bg-slate-200 text-slate-700', done:'bg-emerald-100 text-emerald-800',
    cancelled:'bg-rose-100 text-rose-800', pending:'bg-amber-100 text-amber-800',
    high:'bg-orange-100 text-orange-800', urgent:'bg-rose-100 text-rose-800',
    critical:'bg-rose-100 text-rose-800', paid:'bg-emerald-100 text-emerald-800' };
  return `<span class="pill ${m[s] || 'bg-slate-100 text-slate-700'}">${esc(v)}</span>`;
}
function card(label, value, tone){
  return `<div class="bg-white border border-slate-200 rounded-lg p-3">
    <div class="text-[10px] uppercase tracking-wide text-slate-500 font-bold">${esc(label)}</div>
    <div class="text-2xl font-bold ${tone||''}">${value}</div></div>`;
}
function empty(msg){
  return `<div class="text-center text-slate-400 py-12 border border-dashed border-slate-300 rounded-lg">${esc(msg)}</div>`;
}
function tbl(heads, rows){
  if (!rows.length) return empty('No data yet.');
  return `<div class="bg-white border border-slate-200 rounded-lg scroll"><table>
    <thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

/* ── Derived values used as list columns (the _ prefixed ones) ── */
function derive(key, row, mod){
  switch(key){
    case '_stock':  return `<b class="${stockOf(row.id)>0?'text-emerald-700':'text-slate-400'}">${stockOf(row.id)}</b>`;
    case '_lines':  return (row._lines||[]).length;
    case '_qty':    return (row._lines||[]).reduce((s,l)=>s+(+l.qty||0),0);
    case '_acc':    return (row._lines||[]).reduce((s,l)=>s+(+l.qcAcceptedQty||0),0);
    case '_value':  return inr((row._lines||[]).reduce((s,l)=>s+(+l.qty||+l.orderQty||0)*(+l.rate||0),0));
    case '_amt':    return inr((+row.qty||0)*(+row.rate||0));
    case '_done':   return jcDone(row.id);
    case '_opdone': return opDone(row.id);
    default: return '';
  }
}
/** Finished qty of a job card = QC-accepted on its last operation. */
function jcDone(jcId){
  const ops = all('jc_ops').filter(o => o.jobCardId === jcId);
  if (!ops.length) return 0;
  const last = ops.reduce((a,b) => (+b.opSeq||0) > (+a.opSeq||0) ? b : a);
  return opDone(last.id);
}
function opDone(opId){
  return all('op_log').filter(l => l.jcOpId === opId && l.logType === 'qc')
                      .reduce((s,l) => s + (+l.qty||0), 0);
}

/* ════════════════════════════════════════════════════════════════
   4. NAVIGATION
   ════════════════════════════════════════════════════════════════ */
let cur = 'dashboard';

function buildNav(){
  const groups = {};
  Object.entries(M).forEach(([k, m]) => {
    groups[m.g] = groups[m.g] || {};
    const s = m.s || '_';
    (groups[m.g][s] = groups[m.g][s] || []).push([k, m]);
  });
  $('nav').innerHTML = Object.entries(groups).map(([g, subs]) => `
    <div class="grp">${esc(g)}</div>
    ${Object.entries(subs).map(([s, list]) => `
      ${s !== '_' ? `<div class="sub">${esc(s)}</div>` : ''}
      ${list.map(([k, m]) => `<a href="#${k}" class="${k===cur?'on':''}">${m.icon} ${esc(m.label)}</a>`).join('')}
    `).join('')}`).join('');
}

function go(){
  cur = (location.hash || '#dashboard').slice(1);
  if (!M[cur]) cur = 'dashboard';
  const m = M[cur];
  $('ttl').textContent = m.label;
  $('sub').textContent = m.s ? `${m.g} › ${m.s}` : m.g;
  buildNav();
  $('body').innerHTML = m.view ? m.view() : listView(cur, m);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', go);

/* ════════════════════════════════════════════════════════════════
   5. GENERIC LIST + FORM
   ════════════════════════════════════════════════════════════════ */
let search = '';

function listView(key, m){
  const rows = all(key).slice().reverse();
  const q = search.toLowerCase();
  const shown = q ? rows.filter(r => JSON.stringify(r).toLowerCase().includes(q)) : rows;
  const cols = m.c || m.f.slice(0,5).map(f => f.k);

  const head = cols.map(c => {
    const f = (m.f||[]).find(x => x.k === c);
    return f ? f.l : c.replace(/^_/, '').toUpperCase();
  });

  const body = shown.map(r => {
    const cells = cols.map(c => {
      if (c.startsWith('_')) return derive(c, r, m);
      const f = (m.f||[]).find(x => x.k === c);
      let v = r[c];
      if (f && f.t === 'ref') return esc(labelOf(f.ref, v));
      if (f && f.t === 'chk') return v ? '✔' : '—';
      if (c === 'status' || c === 'priority' || c === 'severity' || c === 'stage') return v ? pill(v) : '—';
      if (c === 'code') return `<b class="mono">${esc(v)}</b>`;
      if (f && f.t === 'n') return esc(v ?? '');
      return esc(v ?? '—');
    });
    cells.push(`<button class="btn btn-s" onclick="openM('${key}','${r.id}')">Edit</button>
                <button class="btn btn-d" onclick="rm('${key}','${r.id}')">Del</button>`);
    return cells;
  });

  return `
    <div class="flex justify-between items-center mb-3 gap-3">
      <input class="inp max-w-xs" placeholder="🔍 Search…" value="${esc(search)}"
             oninput="search=this.value; $('body').innerHTML = listView('${key}', M['${key}'])">
      <div class="flex gap-2 items-center">
        <span class="text-xs text-slate-500">${shown.length} record${shown.length===1?'':'s'}</span>
        <button class="btn btn-p" onclick="openM('${key}')">+ New</button>

/* ── Modal form ── */
let mKey = null, mId = null, mLines = [];

function openM(key, id){
  mKey = key; mId = id || null;
  const m = M[key];
  const row = id ? byId(key, id) : {};
  mLines = id ? JSON.parse(JSON.stringify(row._lines || [])) : [];
  $('mttl').textContent = (id ? 'Edit ' : 'New ') + m.label;
  $('mbody').innerHTML = `
    <div class="grid grid-cols-3 gap-3">
      ${m.f.map(f => fieldHtml(f, row, key)).join('')}
    </div>
    ${m.lf ? linesHtml(m) : ''}`;
  $('modal').classList.remove('hidden');
}
function closeM(){ $('modal').classList.add('hidden'); mKey = null; mId = null; mLines = []; }

function fieldHtml(f, row, key){
  const v = row[f.k] ?? f.dv ?? '';
  const req = f.r ? '<span class="text-rose-600">★</span>' : '';
  const hint = f.h ? `<div class="text-[10.5px] text-slate-500 mt-1">${esc(f.h)}</div>` : '';
  let inp;
  if (f.ro){
    const shown = v || (M[key].seq ? nextNo(key, M[key].seq) : '');
    inp = `<input class="inp bg-slate-100 mono" name="${f.k}" value="${esc(shown)}" readonly>`;
  } else if (f.t === 'ref'){
    const opts = all(f.ref).map(r =>
      `<option value="${r.id}" ${r.id===v?'selected':''}>${esc(labelOf(f.ref, r.id))}</option>`).join('');
    inp = `<select class="inp" name="${f.k}" ${f.r?'required':''}><option value="">— select —</option>${opts}</select>`;
  } else if (f.t === 'sel'){
    inp = `<select class="inp" name="${f.k}" ${f.r?'required':''}><option value="">— select —</option>
      ${f.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (f.t === 'ta'){
    inp = `<textarea class="inp" name="${f.k}" rows="2">${esc(v)}</textarea>`;
  } else if (f.t === 'chk'){
    inp = `<label class="flex items-center gap-2 h-[32px]"><input type="checkbox" name="${f.k}" ${v?'checked':''}>
           <span class="text-xs text-slate-600">Yes</span></label>`;
  } else {
    const t = f.t === 'n' ? 'number' : f.t === 'd' ? 'date' : 'text';
    const dv = f.t === 'd' && !v ? today() : v;
    inp = `<input class="inp" type="${t}" name="${f.k}" value="${esc(dv)}" ${f.r?'required':''} ${f.t==='n'?'step="any"':''}>`;
  }
  const wide = (f.t === 'ta') ? 'col-span-3' : '';
  return `<div class="${wide}"><label class="lbl">${esc(f.l)} ${req}</label>${inp}${hint}</div>`;
}

function linesHtml(m){
  return `<div class="mt-5 border-t border-slate-200 pt-4">
    <div class="flex justify-between items-center mb-2">
      <div class="font-bold text-sm">Lines</div>
      <button type="button" class="btn btn-s" onclick="addLine()">+ Add Line</button>
    </div>
    <div id="lines">${mLines.map((l,i)=>lineRow(m,l,i)).join('') || empty('No lines yet — click + Add Line.')}</div>
  </div>`;
}
function lineRow(m, l, i){
  return `<div class="grid gap-2 mb-2 items-end" style="grid-template-columns:24px repeat(${m.lf.length},1fr) 34px">
    <div class="text-xs text-slate-400 mono pb-2">${i+1}</div>
    ${m.lf.map(f => {
      const v = l[f.k] ?? f.dv ?? '';
      let inp;
      if (f.t === 'ref'){
        inp = `<select class="inp" data-i="${i}" data-k="${f.k}" onchange="setLine(this)">
          <option value="">—</option>${all(f.ref).map(r=>
          `<option value="${r.id}" ${r.id===v?'selected':''}>${esc(labelOf(f.ref,r.id))}</option>`).join('')}</select>`;
      } else if (f.t === 'sel'){
        inp = `<select class="inp" data-i="${i}" data-k="${f.k}" onchange="setLine(this)">
          <option value="">—</option>${f.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
      } else {
        const t = f.t==='n'?'number':f.t==='d'?'date':'text';
        inp = `<input class="inp" type="${t}" ${f.t==='n'?'step="any"':''} data-i="${i}" data-k="${f.k}"
                value="${esc(v)}" oninput="setLine(this)">`;
      }
      return `<div><label class="lbl">${esc(f.l)}</label>${inp}</div>`;
    }).join('')}
    <button type="button" class="btn btn-d" onclick="rmLine(${i})">✕</button>
  </div>`;
}
function setLine(el){ mLines[+el.dataset.i][el.dataset.k] = el.value; }
function addLine(){ mLines.push({}); redrawLines(); }
function rmLine(i){ mLines.splice(i,1); redrawLines(); }
function redrawLines(){
  const m = M[mKey];
  $('lines').innerHTML = mLines.map((l,i)=>lineRow(m,l,i)).join('') || empty('No lines yet — click + Add Line.');
}

function saveForm(){
  const m = M[mKey];
  const fd = new FormData($('mform'));
  const row = mId ? {...byId(mKey, mId)} : { id: uid(), _at: new Date().toISOString() };

  m.f.forEach(f => {
    if (f.t === 'chk') row[f.k] = $('mform').elements[f.k].checked;
    else row[f.k] = fd.get(f.k) ?? '';
  });
  if (m.seq && !row.code) row.code = nextNo(mKey, m.seq);
  if (m.lf) row._lines = mLines.filter(l => Object.values(l).some(v => v !== '' && v != null));

  // ── Business rule: job work runs on client-supplied material. ──
  if (mKey === 'job_work_orders'){
    for (const l of (row._lines||[])){
      if (!l.sourceBomMasterId) continue;
      const bom = byId('bom_masters', l.sourceBomMasterId);
      const bad = (bom?._lines || []).filter(b => b.bomType === 'purchase');
      if (bad.length){
        alert(`${bom.code} can't be used on a job work order.\n\n` +
              bad.map(b => '• ' + labelOf('items', b.childItemId)).join('\n') +
              `\n\nThese are bought parts. Job work runs on material the client supplies — ` +
              `only Manufacture and Outsource are allowed.\n\nChange them in the BOM, or pick a different BOM.`);
        return;
      }
    }
  }

  const isNew = !mId;
  put(mKey, row);
  if (isNew && m.after) m.after(row);           // cascades fire once, on create
  logAct(isNew ? 'CREATE' : 'UPDATE', m.label, row.code || row.name || row.title || '');
  closeM(); go();
}
function rm(key, id){
  if (!confirm('Delete this record? (soft delete — it stays in the data, hidden)')) return;
  del(key, id); logAct('DELETE', M[key].label, id); go();
}

/* ════════════════════════════════════════════════════════════════
   6. THE ASSEMBLY SCREEN — the conversion (parts out, parent in)
   ════════════════════════════════════════════════════════════════ */
function vAssembly(){
  const sos = all('sales_orders').filter(s => s.bomMasterId);
  if (!sos.length) return `
    ${empty('No assembly orders yet.')}
    <div class="mt-4 bg-sky-50 border border-sky-200 rounded-lg p-4 text-sm">
      <b>To try this:</b> make a BOM (Design › BOM Master) with a parent item and 2 child parts,
      then create a Sales Order and pick that BOM in the <b>BOM</b> field.
    </div>`;

  return sos.map(so => {
    const bom = byId('bom_masters', so.bomMasterId);
    if (!bom) return '';
    const orderQty = (so._lines||[]).reduce((s,l)=>s+(+l.orderQty||0),0);
    const comps = (bom._lines||[]).map(l => {
      const st = stockOf(l.childItemId), per = +l.qtyPerSet || 1;
      return { ...l, per, stock: st, canMake: Math.floor(st / per) };
    });
    const built = all('assembly_units').filter(u => u.salesOrderId === so.id).length;
    // Weakest component decides — 5 and 4 is 4 assemblies, never 9.
    const canBuild = comps.length ? Math.min(...comps.map(c => c.canMake)) : 0;
    const headroom = Math.max(0, Math.min(canBuild, orderQty - built));
    const parentStock = bom.parentItemId ? stockOf(bom.parentItemId) : 0;
    const weakest = comps.length ? comps.reduce((a,b)=>b.canMake<a.canMake?b:a) : null;

    return `<div class="bg-white border border-slate-200 rounded-lg mb-5">
      <div class="px-4 py-3 border-b border-slate-200 flex justify-between items-center">
        <div>
          <b class="mono">${esc(so.code)}</b> · ${esc(labelOf('clients', so.clientId))}
          <span class="text-xs text-slate-500 ml-2">BOM ${esc(bom.code)} → builds ${esc(labelOf('items', bom.parentItemId))}</span>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-p" onclick="assemble('${so.id}')" ${headroom<1?'disabled style="opacity:.4;cursor:not-allowed"':''}>
            Assemble 1 unit</button>
          <button class="btn btn-s" onclick="undoAssembly('${so.id}')" ${built<1?'disabled style="opacity:.4"':''}>Undo last</button>
        </div>
      </div>
      <div class="grid grid-cols-4 gap-3 p-4 bg-slate-50">
        ${card('Order Qty', orderQty)}
        ${card('Assembled', built, 'text-sky-700')}
        ${card('Can build now', headroom, headroom>0?'text-emerald-700':'text-rose-600')}
        ${card('Parent in stock', parentStock, 'text-emerald-700')}
      </div>
      ${weakest ? `<div class="px-4 py-2 text-xs bg-amber-50 border-y border-amber-200">
        Weakest part: <b>${esc(labelOf('items', weakest.childItemId))}</b> —
        ${weakest.stock} in stock ÷ ${weakest.per} per unit = <b>${weakest.canMake}</b> units.
        That is the number, not the sum of all parts.</div>` : ''}
      <div class="scroll"><table>
        <thead><tr><th>Component</th><th>Qty / Unit</th><th>In Stock</th><th>Enough For</th><th>Status</th></tr></thead>
        <tbody>${comps.map(c => `<tr>
          <td>${esc(labelOf('items', c.childItemId))}</td>
          <td>${c.per}</td><td><b>${c.stock}</b></td><td><b>${c.canMake}</b></td>
          <td>${c.canMake >= headroom && headroom > 0 ? pill('ok') :
               c.canMake === 0 ? pill('shortage') : pill('limited')}</td></tr>`).join('')}</tbody>
      </table></div>
      ${built ? `<div class="px-4 py-2 text-xs text-slate-500 border-t border-slate-200">
        Built units: ${all('assembly_units').filter(u=>u.salesOrderId===so.id)
          .map(u=>`#${u.unitNo}`).join(', ')}</div>` : ''}
    </div>`;
  }).join('');
}

function assemble(soId){
  const so = byId('sales_orders', soId);
  const bom = byId('bom_masters', so.bomMasterId);
  if (!bom.parentItemId){
    alert('This BOM does not say which item it builds, so assembling it cannot credit anything.\n\n' +
          'Open the BOM and set its Parent Item first.'); return;
  }
  // Check every component BEFORE moving anything.
  for (const l of (bom._lines||[])){
    const need = +l.qtyPerSet || 1, have = stockOf(l.childItemId);
    if (have < need){
      alert(`Not enough ${labelOf('items', l.childItemId)} to assemble:\n` +
            `on-hand ${have}, needs ${need}.\n\nFinish and QC-accept the missing parts first.`); return;
    }
  }
  const unitNo = all('assembly_units').filter(u => u.salesOrderId === soId).length + 1;
  const ref = `${so.code} / unit ${unitNo}`;
  const deductions = [];
  (bom._lines||[]).forEach(l => {
    const need = +l.qtyPerSet || 1;
    ledger(l.childItemId, 'out', need, 'assembly', ref, 'Assembly consumed');
    deductions.push({ itemId: l.childItemId, qty: need });
  });
  ledger(bom.parentItemId, 'in', 1, 'assembly', ref, 'Assembly produced');
  deductions.push({ itemId: bom.parentItemId, qty: -1 });

  put('assembly_units', { id: uid(), salesOrderId: soId, soCode: so.code, unitNo,
    assemblyDate: today(), bomMasterId: bom.id, deductions, dispatched: false,
    _at: new Date().toISOString() });
  logAct('ASSEMBLED', 'Assembly', ref);
  go();
}

function undoAssembly(soId){
  const units = all('assembly_units').filter(u => u.salesOrderId === soId);
  if (!units.length) return;
  const u = units[units.length - 1];
  if (!confirm(`Undo unit #${u.unitNo}? Parts go back, the assembled unit comes off stock.`)) return;
  // Reverse the SNAPSHOT, not the BOM — the BOM may have changed since.
  (u.deductions||[]).forEach(d =>
    ledger(d.itemId, d.qty > 0 ? 'in' : 'out', Math.abs(d.qty), 'assembly',
           `${u.soCode} / unit ${u.unitNo} (undo)`, 'Assembly undone'));
  del('assembly_units', u.id);
  logAct('UNDO_ASSEMBLY', 'Assembly', `${u.soCode} / unit ${u.unitNo}`);
  go();
}

function quickLog(opId){
  const qty = prompt('QC-accepted quantity for this operation?');
  if (!qty || !(+qty)) return;
  const row = { id: uid(), jcOpId: opId, logType: 'qc', logDate: today(), shift: 'day',
    qty: +qty, rejectQty: 0, _at: new Date().toISOString() };
  put('op_log', row); M.op_log.after(row);
  logAct('OP_LOG', 'Op Entry', `qc ${qty}`);
  go();
}

function vDaily(){
  const d = today();
  const logs = all('op_log').filter(l => l.logDate === d);
  return `<div class="mb-3 text-sm">Work logged today (${d})</div>
    ${tbl(['Job Card Op','Type','Qty','Reject','Operator'], logs.map(l =>
      [esc(labelOf('jc_ops', l.jcOpId)), esc(l.logType), l.qty, l.rejectQty||0,
       esc(labelOf('operators', l.operatorId))]))}`;
}

function vProdDash(){
  const jcs = all('job_cards');
  const done = jcs.filter(j => jcDone(j.id) >= (+j.orderQty||0) && +j.orderQty > 0).length;
  return `<div class="grid grid-cols-5 gap-3 mb-5">
      ${card('Job Cards', jcs.length)}
      ${card('Completed', done, 'text-emerald-700')}
      ${card('In Progress', jcs.length - done, 'text-amber-700')}
      ${card('Operations', all('jc_ops').length)}
      ${card('Logs Today', all('op_log').filter(l=>l.logDate===today()).length)}
    </div>
    ${tbl(['JC No.','Item','Order Qty','Produced','Balance','Progress'], jcs.map(j => {
      const md = jcDone(j.id), oq = +j.orderQty||0, pct = oq?Math.round(md/oq*100):0;
      return [`<b class="mono">${esc(j.code)}</b>`, esc(labelOf('items',j.itemId)), oq, md,
        Math.max(0,oq-md),
        `<div class="w-28 bg-slate-200 rounded h-2 inline-block align-middle"><div class="bg-emerald-600 h-2 rounded" style="width:${Math.min(100,pct)}%"></div></div> ${pct}%`];
    }))}`;
}

function vShopFloor(){
  return tbl(['Machine','Type','Status','Operations Assigned'], all('machines').map(m =>
    [`<b class="mono">${esc(m.code)}</b> ${esc(m.name)}`, esc(m.machineType||''), pill(m.status||'available'),
     all('jc_ops').filter(o=>o.machineId===m.id).length]));
}
function vJobQueue(){
  const rows = all('jc_ops').filter(o => opDone(o.id) === 0).map(o => {
    const jc = byId('job_cards', o.jobCardId);
    return [`<b class="mono">${esc(jc?.code||'—')}</b>`, esc(labelOf('items', jc?.itemId)),
      o.opSeq, esc(o.operation), esc(labelOf('machines', o.machineId)), pill(jc?.priority||'normal')];
  });
  return `<div class="mb-3 text-xs text-slate-500">Operations with nothing logged yet.</div>
    ${tbl(['Job Card','Item','Seq','Operation','Machine','Priority'], rows)}`;
}
function vMachineLoad(){
  return tbl(['Machine','Pending Ops','Done Ops','Load'], all('machines').map(m => {
    const ops = all('jc_ops').filter(o=>o.machineId===m.id);
    const pend = ops.filter(o=>opDone(o.id)===0).length;
    return [esc(labelOf('machines',m.id)), pend, ops.length-pend,
      `<div class="w-32 bg-slate-200 rounded h-2 inline-block align-middle"><div class="bg-amber-500 h-2 rounded" style="width:${Math.min(100,pend*20)}%"></div></div>`];
  }));
}
function vProdSo(){
  return tbl(['SO No.','Client','Items','Job Cards','Produced'], all('sales_orders').map(s =>
    [`<b class="mono">${esc(s.code)}</b>`, esc(labelOf('clients',s.clientId)), (s._lines||[]).length,
     all('job_cards').filter(j=>j.sourceSoId===s.id).length,
     all('job_cards').filter(j=>j.sourceSoId===s.id).reduce((a,j)=>a+jcDone(j.id),0)]));
}
function vProdJw(){
  return tbl(['JWSO No.','Client','Items','Job Cards','Produced','Returned'], all('job_work_orders').map(w => {
    const ret = all('jw_returns').filter(r=>r.jobWorkOrderId===w.id).reduce((a,r)=>a+(+r.qty||0),0);
    return [`<b class="mono">${esc(w.code)}</b>`, esc(labelOf('clients',w.clientId)), (w._lines||[]).length,
      all('job_cards').filter(j=>j.sourceJwId===w.id).length,
      all('job_cards').filter(j=>j.sourceJwId===w.id).reduce((a,j)=>a+jcDone(j.id),0), ret];
  }));
}

function vSoQc(){
  return tbl(['SO No.','Job Cards','QC Accepted','NCs Raised'], all('sales_orders').map(s => {
    const jcs = all('job_cards').filter(j=>j.sourceSoId===s.id);
    return [`<b class="mono">${esc(s.code)}</b>`, jcs.length,
      jcs.reduce((a,j)=>a+jcDone(j.id),0),
      all('nc_register').filter(n=>jcs.some(j=>j.id===n.jobCardId)).length];
  }));
}
function vQcDash(){
  const nc = all('nc_register');
  return `<div class="grid grid-cols-4 gap-3 mb-5">
      ${card('Open NCs', nc.filter(n=>n.status==='open').length, 'text-rose-600')}
      ${card('Total NCs', nc.length)}
      ${card('Open CAPAs', all('capa').filter(c=>c.status!=='closed').length, 'text-amber-700')}
      ${card('QC Logs', all('op_log').filter(l=>l.logType==='qc').length, 'text-emerald-700')}
    </div>
    <h3 class="font-bold text-sm mb-2">Open Non-Conformances</h3>
    ${tbl(['NC No.','Date','Job Card','Qty','Reason','Disposition'], nc.filter(n=>n.status==='open').map(n =>
      [`<b class="mono">${esc(n.code)}</b>`, esc(n.date), esc(labelOf('job_cards',n.jobCardId)),
       n.qty, esc(n.reason||''), esc(n.disposition||'')]))}`;
}

function vOspWip(){
  const rows = all('delivery_challans').filter(d => d.status !== 'received').map(d =>
    [`<b class="mono">${esc(d.code)}</b>`, esc(d.dcDate), esc(labelOf('vendors',d.vendorId)),
     esc(labelOf('items',d.itemId)), d.qty, pill(d.status||'sent')]);
  return `<div class="mb-3 text-xs text-slate-500">Material sitting at an outside vendor.</div>
    ${tbl(['DC No.','Date','Vendor','Item','Qty Out','Status'], rows)}`;
}

function vScDash(){
  return `<div class="grid grid-cols-4 gap-3 mb-5">
      ${card('Open PRs', all('purchase_requests').filter(p=>p.status==='open').length, 'text-amber-700')}
      ${card('Open POs', all('purchase_orders').filter(p=>p.status==='open').length, 'text-sky-700')}
      ${card('GRNs', all('goods_receipt_notes').length)}
      ${card('Vendors', all('vendors').length)}
    </div>
    <h3 class="font-bold text-sm mb-2">Purchase Orders</h3>
    ${tbl(['PO No.','Vendor','Type','Lines','Value','Status'], all('purchase_orders').map(p =>
      [`<b class="mono">${esc(p.code)}</b>`, esc(labelOf('vendors',p.vendorId)), esc(p.poType||''),
       (p._lines||[]).length,
       inr((p._lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.rate||0),0)), pill(p.status)]))}`;

function vSoCosting(){
  const rows = all('sales_orders').map(so => {
    const rev = (so._lines||[]).reduce((s,l)=>s+(+l.orderQty||0)*(+l.rate||0),0);
    const jcs = all('job_cards').filter(j=>j.sourceSoId===so.id);
    const mat = jcs.reduce((s,j)=>{ const it = byId('items', j.itemId);
      return s + (+j.orderQty||0)*(+(it?.rate)||0); },0);
    return [`<b class="mono">${esc(so.code)}</b>`, inr(rev), inr(mat), inr(rev-mat),
      rev ? Math.round((rev-mat)/rev*100)+'%' : '—'];
  });
  return tbl(['SO No.','Revenue','Est. Material Cost','Margin','Margin %'], rows);
}

function vAlerts(){
  const a = [];
  all('items').forEach(i => { const st = stockOf(i.id);
    if ((+i.reorderLevel||0) > 0 && st < +i.reorderLevel)
      a.push(['🔴','Low stock', `${labelOf('items',i.id)} — ${st} left, reorder at ${i.reorderLevel}`]);
    if (st < 0) a.push(['🔴','Negative stock', `${labelOf('items',i.id)} is at ${st}`]); });
  all('sales_orders').forEach(s => {
    if (!all('job_cards').some(j=>j.sourceSoId===s.id) && s.status === 'open')
      a.push(['🟠','SO not planned', `${s.code} has no job cards`]); });
  all('bom_masters').forEach(b => { if (!b.parentItemId)
    a.push(['🟠','BOM has no parent', `${b.code} cannot credit anything when assembled`]); });
  all('nc_register').filter(n=>n.status==='open').forEach(n =>
    a.push(['🟡','Open NC', `${n.code} — ${n.reason||''}`]));
  all('tasks').filter(t=>t.status!=='done' && t.dueDate && t.dueDate < today()).forEach(t =>
    a.push(['🟡','Task overdue', `${t.title} — due ${t.dueDate}`]));
  if (!a.length) return `<div class="bg-emerald-50 border border-emerald-200 rounded-lg p-6 text-center text-emerald-800">
    ✅ Nothing needs attention.</div>`;
  return tbl(['', 'Alert', 'Detail'], a.map(x => [x[0], `<b>${esc(x[1])}</b>`, esc(x[2])]));
}

function vActivity(){
  return tbl(['When','Action','Entity','Detail','User'], all('activity_log').slice().reverse().slice(0,300)
    .map(l => [esc(l.ts), pill(l.action), esc(l.entity), esc(l.detail), esc(l.user)]));
}

function vStuck(){
  const s = [];
  all('job_cards').forEach(j => { if (!all('jc_ops').some(o=>o.jobCardId===j.id))
    s.push([j.code, 'Job Card', 'No operations defined — nothing can be logged']); });
  all('jc_ops').forEach(o => { if (opDone(o.id) === 0){ const jc = byId('job_cards', o.jobCardId);
    s.push([jc?.code||'—', 'Operation ' + o.opSeq, `${o.operation} — nothing logged yet`]); }});
  all('customer_dispatches').forEach(d => { if (!all('invoices').some(v=>v.dispatchId===d.id))
    s.push([d.code, 'Dispatch', 'Dispatched but not invoiced']); });
  return `<div class="mb-3 text-xs text-slate-500">Anything that has stopped moving.</div>
    ${tbl(['Document','Stage','Why it is stuck'], s.map(x =>
      [`<b class="mono">${esc(x[0])}</b>`, esc(x[1]), esc(x[2])]))}`;
}

function vCycle(){
  const rows = all('sales_orders').map(so => {
    const d = all('customer_dispatches').filter(x=>x.salesOrderId===so.id)
      .map(x=>x.dispatchDate).sort().pop();
    const days = (so.soDate && d) ? Math.round((new Date(d)-new Date(so.soDate))/864e5) : null;
    return [`<b class="mono">${esc(so.code)}</b>`, esc(so.soDate), esc(d||'—'),
      days === null ? '<span class="text-slate-400">in progress</span>' : `<b>${days} days</b>`];
  });
  return tbl(['SO No.','Ordered','Last Dispatch','Cycle Time'], rows);
}

function vReports(){
  const r = [
    ['Stock on hand', 'store_inventory'], ['Stock ledger', 'store_transactions'],
    ['Stock valuation', 'stock_valuation'], ['SO overview', 'so_overview'],
    ['SO status', 'so_status'], ['SO costing', 'so_costing'], ['SO cycle time', 'so_cycle_time'],
    ['Pending SO value', 'pending_so'], ['Production dashboard', 'prod_dashboard'],
    ['Job queue', 'job_queue'], ['Machine loading', 'machine_loading'],
    ['QC command center', 'qc_dashboard'], ['SO QC status', 'so_qc_status'],
    ['Supply chain', 'sc_dashboard'], ['OSP at vendor', 'osp_wip'],
    ['Stuck dashboard', 'stuck_dashboard'], ['Activity log', 'activity_log'],
  ];
  return `<div class="grid grid-cols-4 gap-3">${r.map(([l,k]) =>
    `<a href="#${k}" class="block bg-white border border-slate-200 rounded-lg p-4 hover:border-sky-500 hover:shadow-sm">
      <div class="font-bold text-sm">${esc(l)}</div>
      <div class="text-[11px] text-slate-500 mt-1">Open report →</div></a>`).join('')}</div>`;
}

/* ════════════════════════════════════════════════════════════════
   8. EXPORT / IMPORT / RESET / SEED
   ════════════════════════════════════════════════════════════════ */
function expJson(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `innovic-sandbox-${today()}.json`;
  a.click();
}
function impJson(){
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = () => { const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { DB = JSON.parse(r.result); save(); go(); alert('Imported.'); }
                       catch(e){ alert('That file is not valid JSON.'); } };
    r.readAsText(f); };
  i.click();
}
function wipe(){
  if (!confirm('Delete everything and load the sample data again?')) return;
  DB = {}; seed(); save(); location.hash = '#dashboard'; go();
}
