<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Purchase Orders — reference render</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&family=Source+Code+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../01-tokens.css" />
    <link rel="stylesheet" href="../02-innovic-theme.css" />
    <link rel="stylesheet" href="./_render-helpers.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        font-family: var(--bfont);
        font-size: var(--fs-body);
        color: var(--text);
      }
      #content {
        padding: 0 20px 20px;
      }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <div id="main">
      <div id="content">
        <div
          style="display: flex; justify-content: space-between; align-items: center; margin: 14px 0"
        >
          <div class="section-hdr" style="margin-bottom: 0">🧾 Purchase Orders</div>
          <div style="display: flex; gap: 8px">
            <button class="btn btn-ghost">⤓ Excel</button>
            <button class="btn btn-primary">+ New Purchase Order</button>
          </div>
        </div>


        <div
          style="display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; align-items: center"
        >
          <input
            class="innovic-input"
            placeholder="🔍 Search PO No., vendor, PR ref, item…"
            style="flex: 1 1 320px; max-width: 420px"
          />
          <select class="innovic-select" style="width: 150px"><option>All Status</option></select>
          <select class="innovic-select" style="width: 150px"><option>All Types</option></select>
          <select class="innovic-select" style="width: 170px"><option>All Vendors</option></select>
          <input class="innovic-input" type="date" style="width: 150px" />
          <span style="flex: 1"></span>
          <div style="display: flex; gap: 4px">
            <button class="btn btn-ghost btn-sm">List View</button>
            <button class="btn btn-ghost btn-sm">Card View</button>
          </div>
        </div>

        <!-- Active-filter chip row (the PO list has NO KPI strip — ISSUE-030) -->
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px">
          <span class="text3">Filtered: <span style="font-weight: 700; color: var(--amber2)">Open</span></span>
          <button class="btn btn-ghost btn-sm">Show All</button>
        </div>

        <div class="panel">
          <div class="tbl-wrap" style="overflow-x: hidden">
            <table class="innovic-table tbl-grid">
              <thead>
                <tr>
                  <th>Sr No</th>
                  <th>PO No.</th>
                  <th>Type</th>
                  <th style="text-align: left">Vendor</th>
                  <th>PR Ref</th>
                  <th>Lines</th>
                  <th>Total Qty</th>
                  <th>Received</th>
                  <th>Pending</th>
                  <th>Value</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="ds-hint">💡 Click a row to open the purchase order</div>
        </div>
      </div>
    </div>

    <script src="./_shell.js"></script>
    <script src="./_data.js"></script>
    <script>
      document.getElementById('shell').innerHTML = window.INNOVIC_SHELL({
        activeModule: 'Purchase',
        crumbGroup: 'Purchase',
        crumbPage: 'Purchase Orders',
      });
      document.getElementById('rows').innerHTML = window.INNOVIC_PO_ROWS();
    </script>
  </body>
</html>
